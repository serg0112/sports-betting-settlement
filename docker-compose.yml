services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: betting-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nameserver:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-nameserver
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m -XX:MaxDirectMemorySize=128m -XX:-AlwaysPreTouch
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  broker:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-broker
    ports:
      - "10911:10911"
    environment:
      NAMESRV_ADDR: nameserver:9876
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=256m -XX:-AlwaysPreTouch
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    depends_on:
      nameserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin getBrokerConfig -b localhost:10911 -n nameserver:9876 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  rocketmq-init:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-init
    depends_on:
      broker:
        condition: service_healthy
    command: >
      sh -c "sh mqadmin updateTopic -n nameserver:9876 -b broker:10911 -t bet-settlements &&
             sh mqadmin updateSubGroup -n nameserver:9876 -b broker:10911 -g bet-settlement-consumer-group &&
             sh mqadmin topicRoute -n nameserver:9876 -t bet-settlements &&
             sh mqadmin getConsumerConfig -n nameserver:9876 -g bet-settlement-consumer-group"

  proxy:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-proxy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      NAMESRV_ADDR: nameserver:9876
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=256m -XX:-AlwaysPreTouch
    command: sh mqproxy
    depends_on:
      nameserver:
        condition: service_healthy
      broker:
        condition: service_healthy
      rocketmq-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
