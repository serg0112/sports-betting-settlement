services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: betting-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  nameserver:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-nameserver
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  broker:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-broker
    ports:
      - "8081:8081"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: nameserver:9876
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    depends_on:
      - nameserver

  proxy:
    image: apache/rocketmq:5.3.0
    container_name: betting-rocketmq-proxy
    ports:
      - "8082:8080"
    environment:
      NAMESRV_ADDR: nameserver:9876
    command: sh mqproxy
    depends_on:
      - nameserver
      - broker
