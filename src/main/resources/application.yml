spring:
  application:
    name: sports-betting-settlement
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: jdbc:h2:mem:betting;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8080

betting:
  broker-mode: embedded
  kafka:
    event-outcomes-topic: event-outcomes
    consumer-group: event-outcome-settlement-group
    publish-timeout: 5s
  rocketmq:
    endpoints: localhost:8081
    bet-settlements-topic: bet-settlements
    consumer-group: bet-settlement-consumer-group
    enable-ssl: false
